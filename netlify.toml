[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so React Router works on refresh and deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: cache static assets better (tweak as needed)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
